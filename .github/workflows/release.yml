name: Release

# Automatic releases. On every push to `main`, if the version in Cargo.toml has
# no matching `v<version>` git tag yet, this builds per-platform binaries and
# publishes a release (creating the tag at the merge commit). So cutting a
# release is just: bump `version` in Cargo.toml and merge — no manual tagging.
# Can also be run by hand from the Actions tab (workflow_dispatch).
#
# Assets are `ghome-<target>.tar.gz`, exactly the name `ghome self-update` looks
# for on the latest release. aarch64 Linux is intentionally omitted: the
# secret-service keyring backend links libdbus, awkward to cross-compile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to tell whether this version already shipped
      - id: v
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git tag -l "v$version" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version already released — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          tar -czf "ghome-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" ghome
          shasum -a 256 "ghome-${{ matrix.target }}.tar.gz" > "ghome-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ghome-${{ matrix.target }}
          path: ghome-${{ matrix.target }}.tar.gz*

  release:
    name: publish release
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
