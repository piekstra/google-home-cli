name: release

# Cut a release by pushing a tag like `v0.2.0`. Cross-platform artifacts live
# here rather than in per-push CI, so the expensive macOS runner (about 10x
# Linux) is billed once per release instead of once per commit. One job per
# OS: Linux and ONE macOS job (Apple Silicon, which cross-compiles the Intel
# target; the macOS SDK is universal). No Windows: SECURITY.md says why. Build
# jobs are independent (fail-fast: false) and each attaches its own tarballs,
# so a slow or dead macOS queue never blocks the Linux assets. The `.mcpb`
# (Claude Desktop extension) needs both, so it is packed last, on Linux.
#
# Only `publish`, which runs on a tag alone and runs no third-party build
# code, can write to the repository; building and packing (cargo, npx)
# happen with a read-only token that checkout does not persist.
#
# aarch64 Linux is omitted on purpose: the secret-service keyring backend links
# libdbus, awkward to cross-compile.
#
# The versions are checked before anything is built: the tag, Cargo.toml
# and the .mcpb manifest must agree, or nothing is built or published.
# `publish` attaches whatever was built to a draft, even when one OS failed, and
# publishes it only once every expected asset is there. A missing one fails the
# run and leaves the draft.
#
# A pull request that changes how releases are built, or the dependencies
# and version (Cargo.toml, Cargo.lock), runs every job but `publish` as a
# dry run: everything is built and packed, nothing is attached to a
# release. The macOS build runs nowhere else, so a dependency that breaks it
# shows on its pull request, not on the tag. The version
# agreement also runs on every pull request, in tests/packaging.rs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The manifest's version must be the crate's, and on a tag the tag's, or
  # self-update and Claude Desktop would see one version and run another.
  versions:
    name: check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag, Cargo.toml and manifest agree
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          manifest_version=$(jq -r .version packaging/mcpb/manifest.json)
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::packaging/mcpb/manifest.json is $manifest_version but Cargo.toml is $version"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          # Ubuntu mirrors fail index downloads now and then; retry before giving up.
          for i in 1 2 3; do sudo apt-get update && break; sleep 15; done
          sudo apt-get install -y libdbus-1-dev pkg-config
      # Asset names are the contract `ghome self-update` resolves against:
      # <bin>-<target>.tar.gz plus a sibling .sha256. The bare binaries also
      # go to bin/<target>/ for the .mcpb job.
      - name: Build and package each target
        run: |
          set -euo pipefail
          sha256() { if command -v shasum >/dev/null; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --locked --target "$t"
            exe=ghome
            tar -C "target/$t/release" -czf "ghome-$t.tar.gz" "$exe"
            sha256 "ghome-$t.tar.gz" > "ghome-$t.tar.gz.sha256"
            mkdir -p "bin/$t"
            cp "target/$t/release/$exe" "bin/$t/"
          done
      # Claude Desktop picks a binary by OS, not by CPU, so the .mcpb carries
      # one universal macOS binary.
      - name: Universal macOS binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin/universal-apple-darwin
          lipo -create -output bin/universal-apple-darwin/ghome \
            bin/aarch64-apple-darwin/ghome bin/x86_64-apple-darwin/ghome
          lipo -info bin/universal-apple-darwin/ghome
      # A binary that fails at startup is not published. The x86_64 macOS slice cannot
      # run on this arm64 runner. None of this reads a credential.
      - name: Run what this runner can run
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) bins=(bin/aarch64-apple-darwin/ghome bin/universal-apple-darwin/ghome) ;;
            *) bins=(bin/x86_64-unknown-linux-gnu/ghome) ;;
          esac
          for b in "${bins[@]}"; do
            "$b" --version
            "$b" mcp --list-tools > /dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: bin/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            ghome-*.tar.gz
            ghome-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  mcpb:
    name: pack the Claude Desktop extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The `versions` job has already held the manifest to Cargo.toml and
      # the tag.
      - name: Assemble, validate and pack
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          stage="$RUNNER_TEMP/ghome"
          mkdir -p "$stage/server/linux"
          cp packaging/mcpb/manifest.json LICENSE "$stage/"
          cp bin/universal-apple-darwin/ghome "$stage/server/ghome"
          cp bin/x86_64-unknown-linux-gnu/ghome "$stage/server/linux/ghome"
          # Artifacts drop the executable bit; the .mcpb keeps what it is given.
          chmod +x "$stage/server/ghome" "$stage/server/linux/ghome"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$stage/manifest.json"
          npx -y @anthropic-ai/mcpb@2.1.2 pack "$stage" "ghome-$version.mcpb"
          sha256sum "ghome-$version.mcpb" > "ghome-$version.mcpb.sha256"
          unzip -Z "ghome-$version.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mcpb
          path: ghome-*.mcpb*
          retention-days: 7
          if-no-files-found: error

  # Attaches whatever was built to a draft, even when one OS failed, so a dead
  # macOS queue still leaves the Linux tarball there. Publishes the draft only when
  # nothing expected is missing, and otherwise fails. Never runs when the versions
  # disagree.
  publish:
    name: publish the release
    needs: [versions, build, mcpb]
    if: ${{ !cancelled() && needs.versions.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # A draft first, because `self-update` reads the latest published release: a
      # build that failed leaves the assets it did get on a draft, and nobody on the
      # platform it failed for is sent to a release that lacks theirs.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/ghome-*.tar.gz
            dist/ghome-*.tar.gz.sha256
            dist/ghome-*.mcpb
            dist/ghome-*.mcpb.sha256
          generate_release_notes: true
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "ghome-$t.tar.gz" "ghome-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          for f in "ghome-$version.mcpb" "ghome-$version.mcpb.sha256"; do
            [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
