[package]
name = "google-home-cli"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Google Home from the terminal: audit and fix rooms, control devices, and manage the home graph over the app's private API. Keychain-secured, agent-friendly."
license = "MIT"
repository = "https://github.com/piekstra/google-home-cli"
homepage = "https://github.com/piekstra/google-home-cli"
readme = "README.md"
keywords = ["google-home", "smart-home", "govee", "tplink", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "ghome"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.7.0", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.7.0" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.7.0" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.7.0" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.7.0" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.7.0" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls", "http2"] }

# Native gRPC over HTTP/2 for the RPCs the JSON gateway can't carry; reqwest
# hides HTTP/2 trailers, and gRPC puts its status there.
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
